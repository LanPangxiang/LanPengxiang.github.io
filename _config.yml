title                    : "Pengxiang Lan"
description              : "Ph.D. student at Northeastern University. Research interests include recommender systems, large language models, parameter-efficient fine-tuning, data mining, and knowledge editing."
repository               : "LanPangxiang/LanPengxiang.github.io"
google_scholar_stats_use_cdn : true

# Site Author
author:
  name             : "Pengxiang Lan"
  avatar           : "https://avatars.githubusercontent.com/u/73155178?v=4"
  bio              : "Ph.D. Student @ Northeastern University"
  location         : "Shenyang, China"
  employer         : "Northeastern University"
  googlescholar    : "https://scholar.google.com/citations?user=ULw0mF0AAAAJ"
  email            : "pengxianglan@stumail.neu.edu.cn"
  github           : "LanPangxiang"
  dblp             : "https://dblp.org/pid/329/5834.html"

# Reading Files
include:
  - .htaccess
  - _pages
  - files

exclude:
  - docs
  - google_scholar_crawler
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Asia/Shanghai

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

compress_html:
  clippings: all
  ignore:
    envs: development
