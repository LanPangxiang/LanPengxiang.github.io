title                    : "Pengxiang Lan"
description              : "Ph.D. Student in Software Engineering at Northeastern University. Research interests include recommender systems, large language models, and spatio-temporal intelligence."
repository               : "LanPangxiang/LanPengxiang.github.io"
google_scholar_stats_use_cdn : true

author:
  name             : "Pengxiang Lan"
  avatar           : "images/android-chrome-512x512.png"
  bio              : "Ph.D. Student in Software Engineering"
  location         : "Shenyang, China"
  employer         : "Northeastern University"
  googlescholar    : ""
  email            : ""
  github           : "LanPangxiang"

include:
  - .htaccess
  - _pages
  - files

exclude:
  - docs
  - google_scholar_crawler

encoding: "utf-8"
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Shanghai

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
